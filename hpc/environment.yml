# Reproduces the local `sfincs` env on Amarel. Pins captured 2026-06-12 from the
# working WSL2 env. Bleeding-edge stack (py3.14 / numpy2.4 / xarray2026.4) — if the
# conda solve fights on Amarel, relax the exact pins to `>=` and let it resolve.
#
# IMPORTANT: hydromt_sfincs is an EDITABLE dev install, NOT pip-installable by version.
# After the env is created, install it from the pinned commit (see amarel_bootstrap.md):
#   git clone https://github.com/Deltares/hydromt_sfincs.git
#   cd hydromt_sfincs && git checkout d8514d6   # = 2.0.0rc2 we've been running
#   pip install -e .
name: sfincs
channels:
  - conda-forge
dependencies:
  - python=3.14
  - hydromt=1.3.1
  - xugrid=0.15.2
  - xarray=2026.4.0
  - numpy=2.4.5
  - geopandas=1.1.3
  - rasterio=1.5.0
  - rioxarray=0.22.0
  # support libs the notebook/build use
  - dask
  - netcdf4
  - contourpy
  - matplotlib
  - hvplot
  - pyproj
  - shapely
  - pandas
  # mapbox_earcut: transitive dep of hydromt_sfincs (prebuilt C++ on conda-forge)
  - mapbox_earcut
  # cdsapi: needed by the ERA5 download scripts (Phase 6)
  - cdsapi
  # s3fs: needed by download_aorc_sandy_precip.py (AORC precip from AWS Open Data)
  - s3fs
  # notebook execution (headless run via `jupyter nbconvert --execute`)
  - nbconvert
  - nbclient
  - ipykernel
  - jupyter_client
  # cartopy: plot_basemap() in the validation cells imports it
  - cartopy
  - pip
  # cht_tide is the only hard dep of hydromt_sfincs that is pip-only (Deltares libs).
  # It pulls cht_utils -> boto3/toml/paramiko. None pin numpy, so they coexist with the
  # bleeding-edge conda numpy 2.4.5. Verified on Amarel 2026-06-15.
  - pip:
      - cht_tide
      # nbstripout: git clean filter that strips notebook outputs/metadata on commit.
      # Run once per clone: python scripts/setup_nbstripout.py
      - nbstripout
